server {
    listen 80;
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Agentic analysis runs a multi-turn LLM tool loop and can take minutes.
        # nginx defaults to a 60s read timeout, which surfaced as a 504 on
        # POST /api/incidents/{id}/analyze while the backend was still working.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
